name: AI Testing Agent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEADLESS: 'true'
      PARALLELISM: '4'
      DEFAULT_TIMEOUT_MS: '30000'
      RETRIES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile project before Playwright CLI
        run: mvn -B --no-transfer-progress clean -DskipTests compile

      - name: Preflight validate repository plan
        run: mvn -B --no-transfer-progress exec:java -Dexec.args="validate plan examples/plans/api/v3-plan-file.json"

      - name: Preflight validate repository suite
        run: mvn -B --no-transfer-progress exec:java -Dexec.args="validate suite examples/suites/v3-suite.json"

      - name: Install Playwright Chromium
        run: mvn -B --no-transfer-progress -DskipTests exec:java@playwright-cli -Dexec.args="install chromium"

      - name: Build and unit test
        run: mvn -B --no-transfer-progress verify

      - name: Run all repository examples
        run: bash scripts/ci/run-examples.sh

      - name: Upload test and example reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-testing-agent-ci-reports
          path: |
            reports/
            screenshots/
            target/surefire-reports/
            target/ci-examples/
          if-no-files-found: ignore
          retention-days: 14
